[project]
name = "ghostty-textual"
version = "0.0.1"
description = "Textual terminal widget backed by libghostty-vt"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "textual>=8.2.8,<9",
  # Pinned exactly: ghostty-textual binds pyghostty's PRIVATE _ffi/_cdef
  # modules, which may change without deprecation. See spec v2 §7.
  "pyghostty==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostty_textual"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "performance: native extraction performance budgets",
  "packaging: builds and installs distribution artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
]
