name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
          cd "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts=--all .'

  test:
    name: Test ${{ matrix.platform }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux amd64 (x86_64)
            runner: ubuntu-24.04
            machine: x86_64
            python: "3.12"
          - platform: Linux arm64 (aarch64)
            runner: ubuntu-24.04-arm
            machine: aarch64
            python: "3.12"
          - platform: macOS arm64
            runner: macos-15
            machine: arm64
            python: "3.12"
          - platform: macOS amd64 (x86_64)
            runner: macos-15-intel
            machine: x86_64
            python: "3.12"
            frame_budget_mode: report
          - platform: Linux amd64 (x86_64)
            runner: ubuntu-24.04
            machine: x86_64
            python: "3.15"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: Verify native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import platform
          assert platform.machine() == os.environ["EXPECTED_MACHINE"], platform.machine()
          PY
      - run: uv run --no-sync ruff check src tests benchmarks
      - name: Functional, memory, ABI, and packaging tests
        run: uv run --no-sync pytest -q -k 'not test_full_frame_extraction_within_budget'
      - name: Full-frame extraction timing
        run: >-
          uv run --no-sync pytest -q -s
          tests/test_performance.py::test_full_frame_extraction_within_budget
        env:
          # Intel macOS has exceeded 100 ms on both baseline and optimized code.
          # Report its timing without relaxing functional or memory checks.
          GHOSTTY_TEXTUAL_FRAME_BUDGET_MS: "100"
          GHOSTTY_TEXTUAL_FRAME_BUDGET_MODE: ${{ matrix.frame_budget_mode || 'enforce' }}
      - run: uv build --no-sources
      - name: Validate PyPI metadata and README
        run: uvx --from twine twine check --strict dist/*
      - name: Install and exercise the wheel in a clean environment
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke" --python .venv/bin/python
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          import sys
          from importlib.metadata import version

          from ghostty_textual import Terminal, TerminalView

          assert version("pyghostty") == "0.1.4"
          assert version("ghostty-textual") == "0.1.0"
          assert "pyghostty._ffi" not in sys.modules
          with Terminal(20, 3, scrollback=100) as terminal:
              terminal.feed(b"hello")
              frame = terminal.snapshot()
              assert "".join(cell.text for cell in frame.row_patches[0].cells).startswith("hello")
              terminal.feed(b"\r\nline" * 20)
              terminal.scroll_to_top()
              assert not terminal.viewport.at_bottom
              terminal.scroll_to_bottom()
              assert terminal.viewport.at_bottom
          PY

      - name: Retain tested distributions
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, secrets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Verify tag and distribution versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import tarfile
          import tomllib
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "tag/package version mismatch"
          stem = f"ghostty_textual-{version}"
          wheel = Path("dist") / f"{stem}-py3-none-any.whl"
          sdist = Path("dist") / f"{stem}.tar.gz"
          assert set(Path("dist").iterdir()) == {wheel, sdist}, "unexpected distributions"
          with zipfile.ZipFile(wheel) as archive:
              wheel_metadata = archive.read(f"{stem}.dist-info/METADATA")
          with tarfile.open(sdist) as archive:
              sdist_metadata = archive.extractfile(f"{stem}/PKG-INFO").read()
          for metadata in (wheel_metadata, sdist_metadata):
              parsed = BytesParser().parsebytes(metadata)
              assert parsed["Name"] == "ghostty-textual", "unexpected package name"
              assert parsed["Version"] == version, "distribution version mismatch"
          print(f"Verified {wheel.name} and {sdist.name} for v{version}")
          PY
      - name: Attach distributions and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release-assets.txt
          mkdir -p "$RUNNER_TEMP/existing-release"
          for asset in dist/*; do
            name=$(basename "$asset")
            if grep -Fxq "$name" release-assets.txt; then
              gh release download "$RELEASE_TAG" --pattern "$name" \
                --dir "$RUNNER_TEMP/existing-release"
              cmp "$asset" "$RUNNER_TEMP/existing-release/$name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          gh release edit "$RELEASE_TAG" --draft=false

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ghostty-textual
    permissions:
      id-token: write
    concurrency:
      group: pypi-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish tested distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  abi-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv pip install --upgrade pyghostty
      - name: Report tested upstream binding
        run: uv run --no-sync python -c "from importlib.metadata import version; print('pyghostty==' + version('pyghostty'))"
      - run: uv run --no-sync pytest tests/test_abi.py -v
