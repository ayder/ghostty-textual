[project]
name = "ghostty-textual"
version = "0.1.0"
description = "Textual terminal widget backed by libghostty-vt"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
  "Typing :: Typed",
]
dependencies = [
  # CFFI 2.1.0 wheels predate a CPython 3.15 ABI change and crash in callbacks.
  "cffi>=2.1.1; python_version >= '3.15'",
  "textual>=8.2.8,<9",
  # Pinned exactly: ghostty-textual binds pyghostty's PRIVATE _ffi/_cdef
  # modules, which may change without deprecation. See spec v2 §7.
  "pyghostty==0.1.4",
]

[project.urls]
Homepage = "https://github.com/ayder/ghostty-textual"
Documentation = "https://github.com/ayder/ghostty-textual#readme"
Source = "https://github.com/ayder/ghostty-textual"
Issues = "https://github.com/ayder/ghostty-textual/issues"

[project.optional-dependencies]
dev = [
  "packaging>=24.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostty_textual"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "performance: native extraction performance budgets",
  "packaging: builds and installs distribution artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
]
